move_category_money:
  fields:
    from_category:
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    to_category:
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    amount:
      required: true
      selector:
        number:
          min: 0.01
          max: 1000000
          step: 0.01
          mode: box
    allow_overdraw:
      default: false
      selector:
        boolean:

transfer_account_money:
  fields:
    from_account:
      required: true
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    to_account:
      required: true
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    amount:
      required: true
      selector:
        number:
          min: 0.01
          max: 1000000
          step: 0.01
          mode: box
    category:
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    memo:
      selector:
        text:
    allow_overdraw:
      default: false
      selector:
        boolean:

get_category_history:
  fields:
    category:
      required: true
      selector:
        entity:
          integration: ynab_custom
          domain: sensor
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 2000
          mode: box
