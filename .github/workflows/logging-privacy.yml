name: Logging privacy regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logging-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exercise logging paths with synthetic private data
        run: python -m unittest discover -s tests -v
